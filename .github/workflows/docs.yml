# coverity-triage-kit の説明サイト（docs-site/）をビルドし、main では GitHub Pages に公開します。
# ページの一部（認証情報の手順、設定ファイル、版）はプラグインのファイルから差し込むため、プラグインの変更でもビルドします。
# 最初の1回だけ、リポジトリの Settings → Pages で、Source を「GitHub Actions」にします。
name: docs-site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'plugins/coverity-triage-kit/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'plugins/coverity-triage-kit/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: MkDocs と Material for MkDocs をインストールする
        run: python -m pip install --disable-pip-version-check --quiet -r docs-site/requirements.txt
      # リンク切れ、見出しのないアンカー、プラグインから差し込めない部分があると、不合格になります
      - name: ビルドする
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict -f docs-site/mkdocs.yml -d "$RUNNER_TEMP/site"
      - name: 公開するファイルをまとめる
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: 公開
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
