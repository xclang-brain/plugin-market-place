# coverity-triage-kit の、モデルを使用しないテストを、Windows と Linux で実行します。
# 利用者の PC は Windows を想定しているため、すべてのスイートを windows-latest でも実行します。
# 実行するスイートは、tests/run.py が skills/、mcp-servers/、tests/ から見つけます。
# モデルを使用する EVAL（tests/eval）は、利用料がかかるため、実行しません。
name: coverity-triage-kit

on:
  push:
    paths:
      - 'plugins/coverity-triage-kit/**'
      - '.github/plugin/marketplace.json'
      - '.github/workflows/coverity-triage-kit.yml'
  pull_request:
    paths:
      - 'plugins/coverity-triage-kit/**'
      - '.github/plugin/marketplace.json'
      - '.github/workflows/coverity-triage-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: テスト（${{ matrix.os }}、Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        # 3.10 は、対応する最も古いバージョンです。3.x は、その時点の最新の安定版です
        python: ['3.10', '3.x']
    defaults:
      run:
        working-directory: plugins/coverity-triage-kit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # テストは、同じ流れを git と svn の両方で実行します
      - name: Subversion をインストールする（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update --quiet && sudo apt-get install --yes --quiet subversion
      - name: Subversion をインストールする（Windows）
        if: runner.os == 'Windows'
        run: |
          choco install sliksvn --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:ProgramFiles 'SlikSvn\bin')
      # テストのプロセスは、frontmatter とサンプルの警告を PyYAML で読み取ります
      - name: PyYAML をインストールする
        run: python -m pip install --disable-pip-version-check --quiet pyyaml
      # 画面のテスト（skills/coverity-gui/tests）は、Playwright の Chromium でページを操作します。
      # テストがリポジトリにファイルを残すと不合格になるため、リポジトリの外にインストールして、NODE_PATH で指定します
      - name: Playwright と Chromium をインストールする
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
      # インストールに失敗すると、svn のテストと画面のテストはスキップされ、合格に見えます。そのため、先に確認します
      - name: Subversion と Playwright を使用できることを確認する
        shell: bash
        run: |
          svn --version --quiet
          svnadmin --version --quiet
          node -e "const { chromium } = require('playwright'); if (!require('fs').existsSync(chromium.executablePath())) { console.error('Chromium がありません'); process.exit(1); }"
      # uv run で実行するスクリプトと MCP サーバーも、このジョブの Python で実行します
      - name: テストを実行する
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python tests/run.py
