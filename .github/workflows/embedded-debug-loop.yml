# embedded-debug-loop のテストを、Windows と Linux のマシンで動かす。
# 利用者の PC は Windows なので、スキルのテストは windows-latest でも動かす。
# Linux は ubuntu-24.04 に固定する（ubuntu-latest は Ubuntu 26 に移り、Python 3.8 を入れられないおそれがある）。
name: embedded-debug-loop

on:
  push:
    paths:
      - 'plugins/embedded-debug-loop/**'
      - '.github/workflows/embedded-debug-loop.yml'
  pull_request:
    paths:
      - 'plugins/embedded-debug-loop/**'
      - '.github/workflows/embedded-debug-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  skills:
    name: スキル（${{ matrix.os }}、Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.8', '3.12']
    defaults:
      run:
        working-directory: plugins/embedded-debug-loop/skills
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # pyftpdlib：FTP のテスト。PyYAML：書いた設定ファイルが YAML として読めるかのテスト（ないと飛ばされる）
      - name: テストに使うパッケージを入れる
        run: |
          python -m pip install --disable-pip-version-check pyftpdlib pyyaml
          python -c "import pyftpdlib, yaml; print('pyftpdlib', pyftpdlib.__ver__, '/ PyYAML', yaml.__version__)"
      # スキルの名前は書かない。tests/ があるフォルダを、すべて動かす
      - name: 各スキルのテスト
        shell: pwsh
        run: |
          $failed = @()
          foreach ($skill in Get-ChildItem -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'tests') }) {
            Write-Host "::group::$($skill.Name)"
            Push-Location $skill.FullName
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { $failed += $skill.Name }
            Pop-Location
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::テストが通らないスキル：$($failed -join '、')"
            exit 1
          }

  independence:
    name: 部品の独立性（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/embedded-debug-loop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: テストに使うパッケージを入れる
        run: python -m pip install --disable-pip-version-check pyftpdlib pyyaml
      - name: 独立性のテスト
        run: python -m unittest discover -s tests/independence -v

  extension:
    name: Web管理画面（${{ matrix.os }}、Node 20）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/embedded-debug-loop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Web管理画面のテスト
        shell: bash
        run: node --test tests/extension/*.test.mjs

  setup-stdin-windows:
    name: setup の標準入力と文字コード（Windows の PowerShell、Python ${{ matrix.python }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    defaults:
      run:
        shell: pwsh
        working-directory: plugins/embedded-debug-loop/skills/setup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: here-string をパイプで渡し、ファイルと標準出力を確かめる
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $PWD 'scripts/config_tool.py'
          $work = Join-Path $env:RUNNER_TEMP 'setup-stdin'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $cfg = Join-Path $work 'kettle.yaml'
          # 期待する値は、文字の番号から作る（このファイルの文字コードに頼らない）
          $place = -join ([char[]](0x4E8C, 0x968E, 0x306E, 0x53F0, 0x6240))
          $yaml = "# " + (-join ([char[]](0x7F6E, 0x304D, 0x5834, 0x6240))) + "`n# e.g. kitchen`nplace: `n"
          [IO.File]::WriteAllText($cfg, $yaml, [Text.UTF8Encoding]::new($false))

          Write-Host "PowerShell $($PSVersionTable.PSVersion) / OutputEncoding $($OutputEncoding.WebName) / Console $([Console]::OutputEncoding.WebName)"

          # 1. SKILL.md と同じ書き方（@' と '@ の here-string をパイプで渡す）
          $out = @'
          二階の台所
          '@ | python $tool set $cfg place --stdin
          if ($LASTEXITCODE -ne 0) { throw "set が失敗しました: $out" }
          $text = [IO.File]::ReadAllText($cfg, [Text.UTF8Encoding]::new($false))
          Write-Host $text
          if ($text -notmatch ('(?m)^place: "' + [regex]::Escape($place) + '"$')) { throw "設定ファイルの値が違います: $text" }
          if ($text.Contains("`r")) { throw "設定ファイルに CR が入りました" }
          if (($out | Out-String | ConvertFrom-Json).value -ne $place) { throw "set の標準出力の値が違います: $out" }

          # 2. 標準出力（コンソールの文字コード。PowerShell も同じ文字コードで読む）
          $got = python $tool get $cfg place
          if ($LASTEXITCODE -ne 0) { throw "get が失敗しました: $got" }
          if (($got | Out-String | ConvertFrom-Json).value -ne $place) { throw "get の標準出力の値が違います: $got" }

          # 3. 日本語の Windows と同じ組み合わせ（Python も PowerShell も cp932）
          [Text.Encoding]::RegisterProvider([Text.CodePagesEncodingProvider]::Instance)
          $env:PYTHONIOENCODING = 'cp932'
          [Console]::OutputEncoding = [Text.Encoding]::GetEncoding(932)
          $got = python $tool get $cfg place
          if ($LASTEXITCODE -ne 0) { throw "get（cp932）が失敗しました: $got" }
          $joined = $got | Out-String
          if (-not $joined.Contains($place)) { throw "cp932 の標準出力に、日本語の値がそのまま出ていません: $joined" }
          if (($joined | ConvertFrom-Json).value -ne $place) { throw "cp932 の標準出力の値が違います: $joined" }
          Write-Host "ok"

      # 利用者のプロファイルが $OutputEncoding を ANSI のコードページにしているとき。
      # パイプで渡すバイト列は UTF-8 として読めないので、OS の既定の文字コードで読む道を通る
      - name: UTF-8 でない入力を渡し、ファイルと標準出力を確かめる
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Text.Encoding]::RegisterProvider([Text.CodePagesEncodingProvider]::Instance)
          $tool = Join-Path $PWD 'scripts/config_tool.py'
          $work = Join-Path $env:RUNNER_TEMP 'setup-stdin-ansi'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $cfg = Join-Path $work 'kettle.yaml'
          [IO.File]::WriteAllText($cfg, "# place`n# e.g. kitchen`nplace: `n", [Text.UTF8Encoding]::new($false))

          $ansi = [Text.Encoding]::GetEncoding([Globalization.CultureInfo]::CurrentCulture.TextInfo.ANSICodePage)
          $value = 'caf' + [char]0xE9
          if ($ansi.GetString($ansi.GetBytes($value)) -ne $value) { throw "ANSI のコードページ $($ansi.CodePage) では、試す値を書けません" }
          Write-Host "ANSI $($ansi.CodePage) / Python $(python -c 'import locale; print(locale.getpreferredencoding(False))')"

          $OutputEncoding = $ansi
          [Console]::OutputEncoding = $ansi
          $out = $value | python $tool set $cfg place --stdin
          if ($LASTEXITCODE -ne 0) { throw "set が失敗しました: $out" }
          $text = [IO.File]::ReadAllText($cfg, [Text.UTF8Encoding]::new($false))
          Write-Host $text
          if ($text -notmatch ('(?m)^place: "' + [regex]::Escape($value) + '"$')) { throw "設定ファイルの値が違います: $text" }
          if ($text.Contains("`r")) { throw "設定ファイルに CR が入りました" }
          if (($out | Out-String | ConvertFrom-Json).value -ne $value) { throw "set の標準出力の値が違います: $out" }
          Write-Host "ok"
