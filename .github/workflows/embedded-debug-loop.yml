# embedded-debug-loop のテストを、Windows と Linux のマシンで動かす。
# 利用者の PC は Windows なので、スキルのテストは windows-latest でも動かす。
# Linux は ubuntu-24.04 に固定する（ubuntu-latest は Ubuntu 26 に移り、Python 3.8 を入れられないおそれがある）。
# 部品（スキルとエージェント）の名前と、テストに要るパッケージの名前は書かない。
# スキルは skills/ の下のフォルダから、パッケージは各スキルの tests/requirements.txt から読む。
# そのため、スキルを足す・消す・置き換えても、作業エージェントを置き換えても、この定義は直さずに済む。
name: embedded-debug-loop

on:
  push:
    paths:
      - 'plugins/embedded-debug-loop/**'
      - '.github/workflows/embedded-debug-loop.yml'
  pull_request:
    paths:
      - 'plugins/embedded-debug-loop/**'
      - '.github/workflows/embedded-debug-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  skills:
    name: スキル（${{ matrix.os }}、Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.8', '3.12']
    defaults:
      run:
        working-directory: plugins/embedded-debug-loop/skills
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # 各スキルの tests/requirements.txt にあるパッケージ（ないと、それを使うテストは飛ばされる）
      - name: テストに使うパッケージを入れる
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Directory | ForEach-Object { Join-Path $_.FullName 'tests/requirements.txt' } | Where-Object { Test-Path $_ -PathType Leaf })
          if ($files.Count -eq 0) {
            Write-Host 'テストに要るパッケージを書いたスキルはありません。'
            exit 0
          }
          $options = @()
          foreach ($file in $files) {
            Write-Host $file
            $options += @('-r', $file)
          }
          python -m pip install --disable-pip-version-check @options
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip list --disable-pip-version-check
      # tests/ があるフォルダを、すべて動かす。
      # Windows では、設定のスキルを PowerShell から使うテスト（標準入力と文字コード）も、ここで動く
      - name: 各スキルのテスト
        shell: pwsh
        run: |
          $failed = @()
          foreach ($skill in Get-ChildItem -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'tests') }) {
            Write-Host "::group::$($skill.Name)"
            Push-Location $skill.FullName
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { $failed += $skill.Name }
            Pop-Location
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::テストが通らないスキル：$($failed -join '、')"
            exit 1
          }

  independence:
    name: 部品の独立性（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/embedded-debug-loop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 独立性のテストは、スキルのフォルダだけをコピーして、そのテストも動かす。スキルのジョブと同じパッケージを入れる
      - name: テストに使うパッケージを入れる
        shell: pwsh
        working-directory: plugins/embedded-debug-loop/skills
        run: |
          $files = @(Get-ChildItem -Directory | ForEach-Object { Join-Path $_.FullName 'tests/requirements.txt' } | Where-Object { Test-Path $_ -PathType Leaf })
          if ($files.Count -eq 0) {
            Write-Host 'テストに要るパッケージを書いたスキルはありません。'
            exit 0
          }
          $options = @()
          foreach ($file in $files) {
            Write-Host $file
            $options += @('-r', $file)
          }
          python -m pip install --disable-pip-version-check @options
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip list --disable-pip-version-check
      - name: 独立性のテスト
        run: python -m unittest discover -s tests/independence -v

  extension:
    name: Web管理画面（${{ matrix.os }}、Node 20）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/embedded-debug-loop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Web管理画面のテスト
        shell: bash
        run: node --test tests/extension/*.test.mjs
