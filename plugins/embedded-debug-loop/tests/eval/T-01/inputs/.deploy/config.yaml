# 機器にファイルを送るスキルの設定ファイルです（EVAL 用。送り先は模擬の機器）。

# 機器のアドレス（必須）。
host: "127.0.0.1"

# 機器の FTP サーバーのポート番号。
port: 2121

# FTP でログインするユーザー名。
user: "root"

# FTP でログインするパスワード（模擬の機器のもの）。
password: "sim"

# パスワードを入れた環境変数の名前。
password_env: ""

# パッシブモードで送るか。
passive: true

# 機器に送るファイル（必須）。
files: ["sensor_app/sensor_app"]

# 機器の送り先のフォルダ（必須）。模擬の機器のルートからの相対パス。
remote_dir: "app"

# 送った後にファイルに付ける権限。
file_mode: "755"

# サム値の種類。
checksum: "none"

# サム値のファイルの名前の末尾に付ける文字。
checksum_suffix: ".sum"

# 機器の応答を待つ最長の秒数。
timeout_seconds: 30
