# シリアルコンソールを記録するスキルの設定ファイルです（EVAL 用。つなぐ先は模擬の機器のコンソール）。

# 機器につながるポート（必須）。模擬の機器は TCP でつなぐ。
port: "socket://127.0.0.1:2323"

# シリアルの速さ。
baud: 115200

# ログインするユーザー名。模擬の機器は、つなぐとシェルが出るので空。
login_user: ""

# ログインのパスワード。
login_password: ""

# パスワードを入れた環境変数の名前。
login_password_env: ""

# シェルのプロンプトの終わりに合う正規表現。
prompt: "[#$] $"

# 機器のシェルで、並べた順に実行するコマンド。
commands: ["./app/sensor_app"]

# 1つのコマンドの出力を待つ最長の秒数。
command_timeout_seconds: 30

# コマンドの後に、さらに出力を記録する秒数。
listen_seconds: 0

# 終わったらログアウトするか。
logout: false
