# log-capture スキルの設定ファイルです。
# 機器のシリアルコンソールにつないで、コマンドを実行し、出力を記録するときのやり方を書きます。
# 各項目の意味は、項目のすぐ上のコメントに書いてあります。

# 機器につながるシリアルポート（必須）。
# 例：/dev/ttyUSB0
# 例：/dev/ttyACM0
port: ""

# シリアルの速さ（ボーレート）。機器の設定と同じ値にする。
# 例：115200
# 例：9600
baud: 115200

# ログインするユーザー名。空ならログインしない。
# 例：root
login_user: "root"

# ログインのパスワード。パスワードがなければ空のままにする。
# ファイルに書きたくないときは、login_password_env に、パスワードを入れた環境変数の名前を書く。
login_password: ""

# パスワードを入れた環境変数の名前。その環境変数があれば、login_password より優先する。
# 例：DEVICE_PASSWORD
login_password_env: ""

# シェルのプロンプトの終わりに合う正規表現。空なら [#$] $ を使う。
# [#$] $ は、「# 」か「$ 」で終わるプロンプトに合う。
# 例：[#$] $
# 例：myboard:~# $
prompt: "[#$] $"

# 機器のシェルで、並べた順に実行するコマンド。機器でプログラムを動かしてログを取るなら、必ず書く。
# 空なら何も実行せず、listen_seconds の秒数だけ出力を記録する（そのときは listen_seconds を 1 以上にする）。
# 例：["/opt/myapp/my_app"]
# 例：["dmesg | tail -n 20", "cat /var/log/messages"]
commands: []

# 1つのコマンドの出力を待つ最長の秒数。過ぎたら Ctrl-C を送って止める。
# 例：30
command_timeout_seconds: 30

# コマンドの後に、さらに出力を記録する秒数。0 なら記録しない。
# 例：10
listen_seconds: 0

# 終わったらログアウトする（exit を送る）か。
# login_user でログインしたときだけ送る。つないだときにもうシェルが出ていたら送らない。
# 選べる値：true / false
logout: true
