# 機器にファイルを送るスキルの設定ファイルです。
# PC にあるファイルを、FTP で機器に送るときのやり方を書きます。
# 各項目の意味は、項目のすぐ上のコメントに書いてあります。

# 機器の IP アドレスか、ホスト名（必須）。
# 例：192.168.1.50
host: ""

# 機器の FTP サーバーのポート番号。ふつうは 21。
# 例：21
port: 21

# FTP でログインするユーザー名。空なら anonymous でログインする。
# 例：root
user: "root"

# FTP でログインするパスワード。
# ファイルに書きたくないときは、password_env に、パスワードを入れた環境変数の名前を書く。
password: ""

# パスワードを入れた環境変数の名前。
# その環境変数があれば、password より優先する。
# 例：DEVICE_FTP_PASSWORD
password_env: ""

# パッシブモードで送るか。送る途中で止まるときは false を試す。
# 選べる値：true / false
passive: true

# 機器に送るファイル（必須）。作業フォルダからの相対パスか、絶対パスで書く。
# 作業フォルダとは、ふつうは、コマンドを動かした今のフォルダ。
# 例：["my_app"]
# 例：["build/my_app", "conf/my_app.conf"]
files: []

# 機器の送り先のフォルダ（必須）。なければ作る。
# 例：/opt/myapp
remote_dir: ""

# 送った後にファイルに付ける権限。8進数の数字。空なら権限を付けない。
# FTP で送ったファイルは、ふつうは実行できない権限になる。
# 機器でプログラムを実行するなら、必ず書く（755 など）。
# 例：755
file_mode: ""

# サム値の種類。サム値は、ファイルが壊れていないかを確かめる値。
# none なら作らない。それ以外なら、サム値のファイルも一緒に送る。
# crc32 は CRC-32。sum32 は全バイトを足した値の下位32ビット。
# サム値のファイルの中身は、16進数8桁（小文字）と改行。
# 選べる値：none / crc32 / sum32
checksum: "none"

# サム値のファイルの名前の末尾に付ける文字。
# .sum なら、my_app のサム値のファイルは my_app.sum。
# サム値のファイルは、送るファイルと同じフォルダに送る。
# 例：.sum
checksum_suffix: ".sum"

# 機器の応答を待つ最長の秒数。
# 例：30
timeout_seconds: 30
