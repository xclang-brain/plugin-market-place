# 解析ツールが出すが、入れた問題ではない警告のうち、本物のバグに見えるもの（参考）
incidental:
  - tool: clang --analyze（core.NonNullParamChecker）
    file: src/app/main.c
    line: 563
    verdict: false_positive
    reason: >-
      parse_args で argv[i + 1] を NULL と比べるため、clang は次の周回の argv[i] が NULL になりうると考える。
      C11 5.1.2.2.1 により i < argc の argv[i] は NULL でない。
  - tool: clang --analyze（core.UndefinedBinaryOperatorResult）
    file: src/drivers/flash_store.c
    line: 286
    verdict: false_positive
    reason: >-
      flash_rec_append（389-393 行）で全メンバーを設定した rec_hdr_t を、flash_store_program が
      バイトの並びとして読む。clang がメンバーをバイト単位で追えないための警告。
