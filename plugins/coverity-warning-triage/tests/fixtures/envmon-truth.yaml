groups:
  - id: G-FRAME_MAX
    title: FRAME_MAX の定義の誤りによる配列の超え（同じ原因）
    root_cause:
      file: include/em4_config.h
      line: 40
      text: "#define FRAME_MAX (FRAME_HDR_LEN + FRAME_PAYLOAD_MAX)"
      explanation: >-
        直前の図（em4_config.h 27-32 行）のとおり、フレームは SOF/LEN/CMD/SEQ の 4 バイト、
        ペイロード最大 64 バイト、CRC 2 バイトで、最大 70 バイト。FRAME_MAX は CRC の
        FRAME_CRC_LEN を足し忘れて 68 になっている。FRAME_MAX の大きさのバッファに
        フレーム全体を入れる 3 か所で、ペイロードが 63 バイト以上のとき 1〜2 バイトあふれる。
    fix: "#define FRAME_MAX (FRAME_HDR_LEN + FRAME_PAYLOAD_MAX + FRAME_CRC_LEN)"
    fix_note: 定義を 1 か所直せば 3 件とも消える。各所でバッファを個別に大きくするのは筋が悪い。
    members: [TB-08, TB-09, TB-10]

