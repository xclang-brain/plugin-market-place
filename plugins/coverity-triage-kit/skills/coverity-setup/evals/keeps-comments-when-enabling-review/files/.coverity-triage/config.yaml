# Coverity の警告のトリアージの設定（チームで共有）
# 変えるときは、チャットで頼むこと
coverity:
  url: https://coverity.example.co.jp:8443   # 本番の Coverity
  api: auto
  # CI のビルドのフォルダを外す
  path_strip_prefixes:
  - /var/ci/work/envmon/   # Jenkins
vcs:
  type: git
  base_branch: main   # リリースのブランチではない
max_items: 30   # 夜間の上限
# --- AI の作業の後の段 ---
agents:
  integration: false   # まだ試していない
