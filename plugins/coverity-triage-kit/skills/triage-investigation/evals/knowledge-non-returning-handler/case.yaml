schema_version: "1.1"
name: knowledge-non-returning-handler
expected_outcome: |
  p が NULL のときは 22 行で fatal() を呼ぶ。fatal()（src/fatal.c の 6〜13 行）は wdt_force_reset() の後
  for (;;) で止まり、戻らない。プロジェクトの知識（.coverity-triage/knowledge.md）にも「fatal() は戻らない」とある。
  よって 24 行で NULL を参照する経路はなく、判定は誤検知（false_positive）。調べた経過に
  「プロジェクトの知識：…」と書き、fatal() の中身もコードで確かめて、src/fatal.c の行を根拠に挙げる。
  推奨は、知識の推奨の方針のとおり逸脱（deviation）。
  答えはチャットで返し、ファイルを変えない。
context:
  scaffold_script: place-files.sh
