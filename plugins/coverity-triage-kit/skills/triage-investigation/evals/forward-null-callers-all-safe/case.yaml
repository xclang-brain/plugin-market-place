schema_version: "1.1"
name: forward-null-callers-all-safe
expected_outcome: |
  関数の中だけなら経路が成り立つが、buf_append は static で、呼び出し元は src/textbuf.c の 3 か所
  （25 行・30 行は文字列の定数、38 行は 35〜37 行で NULL を除いた name）だけなので、s が NULL になる経路はない。
  src/report.c の write_report() は user_name() の NULL を textbuf_name() に渡しうるが、textbuf_name() が NULL のときに
  -1 を返すので buf_append には届かない。判定は誤検知（false_positive）で、根拠に 3 か所の呼び出し元を相対パスと行で挙げる。
  呼び出し元がすべてリポジトリにありコードで確かめたので、確信度は高。推奨は逸脱、または小さく安全な修正。
  答えはチャットで返し、コードを変えず、結果のファイルも作らない。
context:
  scaffold_script: place-files.sh
