schema_version: "1.1"
name: misra-10-4-viewpoint
expected_outcome: |
  Rule 10.4 は、通常の算術変換が行われる演算子の両方の被演算子を、同じ本質的な型の分類にする規則（Required）だと説明する。
  シフトは当たらないこと、文字型と整数の足し算などの例外も示す。例の count > 0 は、符号なし（uint16_t）と符号付きの定数 0 の
  組み合わせで本当に当たり（true_bug）、0U にするのが直し方で、この形なら動きは変わらない。ただし、狭い符号なしの型の計算の式
  （uint16_t の a - b など）と比べる定数に U を付けると、整数の格上げのため動きが変わることがある（(a - b) > 0 は偽、(a - b) > 0U は真）
  ので、30 件を機械的に直さず、そうした式は1件ずつ確かめる（flag ? u8 : 0 を 0U にするのも、結果の型が unsigned int に
  変わるので、そのまま直してよい形ではない）。判定の考え方（本当に違反なら true_bug、Coverity の読み違いや対象外なら
  false_positive、設計上必要で安全を説明できれば intentional。「true_bug のまま逸脱」とはしない）、Required なので逸脱には正式な手続きが要ること、同じマクロや型定義が
  原因で大量に出ているなら原因の1か所を直すことを示す。
