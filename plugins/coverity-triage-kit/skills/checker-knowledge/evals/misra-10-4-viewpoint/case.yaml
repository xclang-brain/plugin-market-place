schema_version: "1.1"
name: misra-10-4-viewpoint
expected_outcome: |
  Rule 10.4 は、通常の算術変換が行われる演算子の両方の被演算子を、同じ本質的な型の分類にする規則（Required）だと説明する。
  例の count > 0 は、符号なし（uint16_t）と符号付きの定数 0 の組み合わせで当たり、0U にするのが直し方だと示す。
  判定の考え方（本当に違反なら true_bug、Coverity の読み違いや対象外なら false_positive、設計上必要で安全を説明できれば intentional）、
  Required なので逸脱には正式な手続きが要ること、同じマクロや型定義が原因で大量に出ているなら原因の1か所を直すことを示す。
