schema_version: "1.1"
name: cert-err33-fclose-read-only
expected_outcome: |
  ERR33-C は、無視して問題ない理由を説明できれば逸脱、できなければ修正（既存のエラーの扱いに合わせる）だと示す。
  読むだけで開いたファイルの fclose の失敗では書き残しのデータを失わないので、無視しても困らない理由を言い切れることが多い
  （書き込んだファイルなら確かめが要る）ことを説明し、直す場合の定石（戻り値を確かめてまわりのエラーの扱いにする、
  無視を (void) で明示する）も示す。戻り値を見ていないのは本当なので、判定は誤検知ではなく意図的（intentional）。
  逸脱コメントの例は「意図的。」で始まり、理由とコードの場所を書く形で、条件・前提・依頼の言い方を含まず、確かめていない事実を書かない。コードは渡されていないので、場所は置き換える印（<ファイル:行> など）にし、
  読んでいないファイルと行を作らない。確かめていない Coverity の注釈やイベントの名前を書かない。
