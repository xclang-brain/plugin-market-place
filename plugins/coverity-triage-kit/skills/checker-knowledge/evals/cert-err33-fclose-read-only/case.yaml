schema_version: "1.1"
name: cert-err33-fclose-read-only
expected_outcome: |
  ERR33-C は、無視して問題ない理由を説明できれば逸脱、できなければ修正だと示す。
  読むだけで開いたファイルの fclose の失敗では書き残しのデータを失わないので、無視しても困らない理由を言い切れることが多い
  （書き込んだファイルなら確かめが要る）ことを説明し、直す場合の定石（戻り値を確かめる、無視を (void) で明示する）も示す。
  逸脱コメントの例は「意図的。」などの判定区分で始まり、理由とコードの場所を書く形で、条件や依頼の言い方を含まない。
