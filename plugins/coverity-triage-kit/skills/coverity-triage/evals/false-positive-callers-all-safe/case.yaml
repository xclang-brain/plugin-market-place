schema_version: "1.1"
name: false-positive-callers-all-safe
expected_outcome: |
  スキルのコマンド（start、next --cid 31001、save）で処置し、結果フォルダーに result.json を保存する。
  関数の中だけなら経路が成立するが、buf_append は static で、呼び出し元は src/textbuf.c の 3 か所
  （25 行と 30 行は文字列リテラル、38 行は 35〜37 行で NULL を除外した name）だけなので、s が NULL になる経路はない。
  src/report.c の write_report() は user_name() の NULL を textbuf_name() に渡しうるが、textbuf_name() が NULL のときに
  -1 を返すので、buf_append には到達しない。判定は誤検知（false_positive）、確信度は高（high）。
  推奨は逸脱（deviation）、または小さく安全な修正（fix）のどちらか。逸脱コメントは「誤検知。」で始まり、条件を付けずに理由と場所を述べる。
  修正コードは、動作を変えない防御的なチェックの差分（fix.patch）か、修正コードがない理由（no_fix_reason）のどちらか。
context:
  scaffold_script: ../scaffold.py
