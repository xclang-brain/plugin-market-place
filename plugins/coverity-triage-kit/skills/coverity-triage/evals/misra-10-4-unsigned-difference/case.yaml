schema_version: "1.1"
name: misra-10-4-unsigned-difference
expected_outcome: |
  12 行の (end - start) > 0 は、本質的な型が符号なしの式と、符号付きの定数 0 の比較で、Rule 10.4（Required）に実際に違反している。
  判定は本物のバグ（規則の違反）、推奨は修正。定数を 0U にすると動作が変わる：uint16_t は int に整数拡張されるので、
  end が start より小さいとき (end - start) は負の int で、> 0 は偽だが、> 0U では unsigned int に変換されて真になり、
  関数のコメント（end が start 以下なら 0 を返す）に反する。修正コードは、意図に合う end > start への書き直し（12 行だけの差分）。
  逸脱コメントは「本物の不具合。」で始まり、問題にならないとは書かない。Classification は Bug、Action は Ignore、Severity は Minor。
  設定ファイルがないので、ファイルは変更せず、修正コードと逸脱コメントの両方をチャットで示す。
context:
  scaffold_script: place-files.sh
