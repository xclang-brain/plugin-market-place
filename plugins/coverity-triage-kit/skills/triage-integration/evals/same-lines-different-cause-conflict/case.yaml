schema_version: "1.1"
name: same-lines-different-cause-conflict
expected_outcome: |
  どちらも NULL_RETURNS で同じ変数 data だが、原因が違う：20021 は 19 行の strchr() が ':' のない行で NULL を返すこと、
  20030 は 21 行の malloc() がメモリ不足で NULL を返すこと。どちらの修正も、自分の呼び出しの後にしか確かめを足さないので、
  1つの修正では両方は片付かない。だから利用者の言うとおりにはまとめない。2つの差分は同じ行（19〜22 行あたり）を変えて
  ぶつかるので、ぶつかる修正（conflicts）として 20021 と 20030 を挙げ、人が反映するときの注意として伝える。
  まとめた逸脱コメントや判定は作らない。チャットで返し、ファイルを作らず、コードも変えない。
