schema_version: "1.1"
name: explains-401-error
expected_outcome: |
  HTTP 401 は、ユーザー名か認証キーの誤り、または認証キーの期限切れであることを伝える。
  Coverity で認証キーを作り直し、環境変数（COV_USER / COV_AUTH_KEY）にターミナルの伏せ字の欄から入れ直すよう、
  道具の準備の手順（準備のコマンド）を案内する。認証キーをチャットに書くよう求めず、値を画面に出させない。設定ファイルは変えない。
  401 と関わらないこと（リポジトリでない、など）を問題として足さない。401 は認証情報が送られて断られたということなので、
  点検で環境変数が見えなくても、それを原因として伝えない（環境変数はこの試験の環境では渡せないため、点検では「なし」と出ることがある）。
context:
  scaffold_script: place-files.sh
