schema_version: "1.1"
name: applies-after-consent
expected_outcome: |
  前の返事で見せた反映の内容（修正 20001・逸脱 20002・却下 G1）に、利用者が「はい」と同意している。
  だから、この返事で聞き直さずに反映する。確認の文字列は前の返事のものが手元にないので、反映の内容を作り直し、
  件数・ID・影響が見せたものと同じことを確かめてから、その確認の文字列で反映する。修正 20001 は、差分から
  coverity-fix/cid-20001 のブランチを作って origin に push し（コミットの文は「Coverity CID 20001: 修正」で始まる）、
  プルリクエストの題名（「Coverity CID 20001: …」）と、作成のリンクがないこと（GitHub ではないリモート）から
  ブランチの名前を伝える。逸脱 20002 は、Coverity に書き戻す道具がないので、書き戻していないことと、
  あとで頼めば残りを書き戻せることを伝える。却下 G1 の CID 20005・20006 を、注釈を残して repo の
  no-grouping.yaml（ブランチではなく、作業中のファイル）に足す。GitHub のトークンを聞かず、approvals.json と
  作業中のソースと main のブランチを変えない。見せた内容のほかは反映しない。
context:
  scaffold_script: place-files.sh
