schema_version: "1.1"
name: applies-after-consent
expected_outcome: |
  件数と ID を示す文を先に出してから反映する（前もって同意を得ていても、見せる文が先）。修正 20001 は、差分から
  coverity-fix/cid-20001 のブランチを作って origin に push し（コミットの文は「Coverity CID 20001: 修正」で始まる）、
  プルリクエストの題名（「Coverity CID 20001: …」）と、作成のリンクがないこと（GitHub ではないリモート）から
  ブランチの名前を伝える。逸脱 20002 は、Coverity に書き戻す道具がないので、書き戻していないことと、
  あとで頼めば残りを書き戻せることを伝える。却下 G1 の CID 20005・20006 を、注釈を残して no-grouping.yaml に足す。
  GitHub のトークンを聞かず、approvals.json と作業中のソースと main のブランチを変えない。
context:
  scaffold_script: place-files.sh
