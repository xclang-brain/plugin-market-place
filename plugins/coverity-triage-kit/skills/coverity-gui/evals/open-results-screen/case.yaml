schema_version: "1.1"
name: open-results-screen
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The agent runs the skill's screen command (gui.py open) for the repository repo/ with the run
  out/20261108-101500 and the results view, without opening a browser. It answers with the URL the
  command printed: http://127.0.0.1:<port>/?t=<token>#run=20261108-101500&view=summary. It tells the
  person to open that URL in the browser of this PC, that approvals are chosen there (not by editing
  approvals.json by hand), and it changes no file of the repository or of the run folder. It does not start
  another server or paste the report instead. The screen's server keeps running after the turn, so the URL
  still answers (200 with the token, 403 without it).
