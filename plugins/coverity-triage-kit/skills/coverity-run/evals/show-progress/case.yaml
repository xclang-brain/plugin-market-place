schema_version: "1.1"
name: show-progress
expected_outcome: |
  The agent reads the state of the given run folder with the batch run skill's read-only status command
  (or by reading its files) and reports, in plain Japanese: 3 work items of which 1 is done (20001,
  recommended 修正, confidence 高), 1 could not be processed (20002, because the worker stopped with no output
  or progress for 30 minutes) and 1 is still marked as being worked on (G1, CIDs 20003 and 20004, at the step of
  deciding whether the warning is real). The run's files have not changed since 2026-11-01 around 09:45, so it
  warns that G1 has shown no activity for a long time and the work may have stopped. It translates internal values
  (phase judge, status in_progress, fix, high and the like) into plain words. It does not change any file in the
  run folder and does not start, resume or stop the run.
context:
  scaffold_script: place-files.sh
