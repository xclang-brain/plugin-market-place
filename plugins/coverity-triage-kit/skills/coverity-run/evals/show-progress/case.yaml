schema_version: "1.1"
name: show-progress
expected_outcome: |
  The agent reads the state of the given run folder with the batch run skill's read-only status command
  (or by reading its files) and reports, in Japanese: 3 work items of which 1 is done (20001, recommended fix,
  confidence high), 1 could not be processed (20002, because the worker stopped with no output or progress
  for 30 minutes) and 1 is still being worked on (G1, CIDs 20003 and 20004, now judging). It does not change
  any file in the run folder and does not start, resume or stop the run.
