schema_version: "1.1"
name: missing-config
expected_outcome: |
  The repository app has no .coverity-triage/config.yaml. The agent checks with the batch run skill's script
  (runs or new-run for the app folder), finds that the settings are missing, tells the user in Japanese to
  prepare .coverity-triage/config.yaml (saying it can be made with a preparation procedure if one is available),
  and does not start the run: no run folder is created and no config file is written by the agent.
  It does not triage the code itself and does not start collecting the settings (URL, project, stream) itself.
context:
  scaffold_script: place-files.sh
