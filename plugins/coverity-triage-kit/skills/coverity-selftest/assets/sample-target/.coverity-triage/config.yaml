# 自己診断の見本の設定。偽の Coverity のデータ（fake-issues.yaml）を使う。
coverity:
  url: https://coverity.example.co.jp:8443
  api: fake
  fake_data: fake-issues.yaml
  revision_field: sourceVersion
vcs:
  type: git
  base_branch: main
  branch_prefix: coverity-fix/
# 結果の置き場所は既定（リポジトリの隣の coverity-triage-out）
max_items: 100
parallel: 3
agents:
  # 検証役も動かして確かめる（統合は使わない）
  review: true
  integration: false
  max_rework: 1
