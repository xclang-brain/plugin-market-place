[project]
name = "coverity-connect"
version = "0.1.0"
description = "MCP server: fetch Coverity Connect warnings and their events, and register triage"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "truststore>=0.10",
]

[project.scripts]
coverity-connect-mcp = "coverity_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coverity_mcp"
