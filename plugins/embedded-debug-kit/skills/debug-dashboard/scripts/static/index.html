<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web管理画面</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>Web管理画面</h1>
  <p class="sub">作業フォルダ：<span id="workdir">―</span></p>
  <p id="notice" class="notice" role="alert" hidden></p>
</header>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true">設定</button>
  <button type="button" role="tab" id="tab-progress" aria-controls="panel-progress" aria-selected="false">進み具合</button>
  <button type="button" role="tab" id="tab-results" aria-controls="panel-results" aria-selected="false">結果</button>
</nav>

<main>
  <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings">
    <p class="hint">
      作業フォルダにある、スキルの設定ファイルの項目です。値を変えると、設定ファイルに書きます。
      パスワードは、ここには入れずに、環境変数の名前を入れます。
    </p>
    <p class="actions">
      <button type="button" id="skills-reload">読み直す</button>
      <span id="skills-result" class="hint" aria-live="polite"></span>
    </p>
    <div id="skills"></div>
  </section>

  <section id="panel-progress" role="tabpanel" aria-labelledby="tab-progress" hidden>
    <p class="sub">セッション：<span id="progress-title">まだ記録がありません</span></p>
    <p id="running" class="hint"></p>
    <p class="actions">
      <button type="button" id="stop" class="danger" disabled>実行を止める</button>
      <span id="stop-result" class="hint" aria-live="polite"></span>
    </p>

    <h2>依頼と報告（届いた順）</h2>
    <ol id="messages" class="messages"></ol>

    <h2>使われたツール（新しい順）</h2>
    <ol id="tools" class="tools"></ol>
  </section>

  <section id="panel-results" role="tabpanel" aria-labelledby="tab-results" hidden>
    <p class="sub">セッション：<span id="results-title">まだ記録がありません</span></p>
    <h2>最後の報告</h2>
    <pre id="last-report" class="text"></pre>

    <div id="verdict" hidden>
      <h2>検証エージェントの最後の判定</h2>
      <pre id="last-verdict" class="text"></pre>
    </div>

    <h2>前のセッション</h2>
    <ol id="sessions" class="sessions"></ol>
  </section>
</main>
</body>
</html>
