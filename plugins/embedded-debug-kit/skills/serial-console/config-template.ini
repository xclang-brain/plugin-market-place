# シリアルで機器のシェルにつなぎ、コマンドを動かすときの設定。
# 「項目 = 値」の形で書く。値を空にするときは「項目 =」とだけ書く。

[settings]

# 機器につながるシリアルポート（必須）。
# Windows は COM と番号（デバイスマネージャーで分かる）、Linux は /dev から書く。
# socket://ホスト:ポート と書くと、シリアルを TCP で中継する機器（シリアルデバイスサーバーなど）につなぐ。
# 例：COM3
# 例：/dev/ttyUSB0
# 例：socket://192.168.1.10:4001
port =

# 通信の速さ（ボーレート）。機器と同じ値にする。
# 例：115200
baud = 115200

# ログインのユーザー名。機器がログインを求めたときに使う。
# 例：root
login_user = root

# ログインのパスワード（秘密）。
# ファイルに書きたくないときは空のままにして、login_password_env を使う。
login_password =

# パスワードを入れた環境変数の名前。この環境変数があれば、login_password より優先する。
# 例：DEVICE_PASSWORD
login_password_env =

# シェルのプロンプトの終わりに合う正規表現。[#$] $ は「# 」か「$ 」で終わるプロンプトに合う。
# 例：[#$] $
# 例：root@myboard:.*# $
prompt = [#$] $

# 機器のシェルで、上から順に動かすコマンド。
# 2つ以上なら、commands = の次の行から、1行に1つずつ、行頭に空白を入れて書く。
# 例：uname -a
commands =

# 1つのコマンドを待つ最長の秒数。過ぎたら Ctrl-C で止め、残りのコマンドは動かさない。
# 例：30
command_timeout_seconds = 30
