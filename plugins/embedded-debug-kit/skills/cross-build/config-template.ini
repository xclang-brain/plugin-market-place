[settings]
# ビルドするフォルダ。作業フォルダからの相対パスか、絶対パス。
# 例：firmware
source_dir = .

# クロスツールチェーンを使えるようにするスクリプト。空なら読み込まない。
# shell が cmd なら .bat か .cmd、powershell なら .ps1、bash なら「.」で読み込めるファイルにする。
# 例：/opt/poky/4.0/environment-setup-cortexa7t2hf-neon-poky-linux-gnueabi
# 例：C:\ti\sdk\setenv.bat
sdk_env =

# コマンドを動かすシェル。auto は、Windows では cmd、ほかでは bash。
# 選べる値：auto / bash / cmd / powershell
shell = auto

# ビルドのコマンド（必須）。source_dir で動かす。1行で書く。
# 例：make -j4
build_command =

# ビルドでできるファイル（必須）。source_dir からの相対パス。
# 2つ以上なら、次の行から、行頭に空白を入れて1つずつ書く。
# 例：build/app
outputs =

# ビルドを待つ最長の秒数。過ぎたら、ビルドを子のプロセスごと止める。
timeout_seconds = 600
