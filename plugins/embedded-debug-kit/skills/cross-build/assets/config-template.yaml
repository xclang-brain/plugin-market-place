# cross-build の設定。機器向けのプログラムをビルドするときに使う。
# 「項目: 値」の形で書く。値を空にするときは「項目:」とだけ書く。
# 記号で始まる値と、「: 」を含む値は、'…' で囲む。

# ビルドするフォルダ。作業フォルダからの相対パスか、絶対パス。
# 例：firmware
source_dir: .

# コマンドを動かすシェル。auto は、Windows では cmd、ほかでは bash。
# 選べる値：auto / bash / cmd / powershell
shell: auto

# クロスツールチェーンを使えるようにするスクリプト。作業フォルダからの相対パスか、絶対パス。空なら読み込まない。
# shell が cmd なら .bat か .cmd、powershell なら .ps1、bash なら bash で読み込めるシェルスクリプトにする。
# 例：/opt/poky/4.0/environment-setup-cortexa7t2hf-neon-poky-linux-gnueabi
# 例：C:\ti\sdk\setenv.bat
sdk_env:

# ビルドのコマンド（必須）。source_dir で動かす。1行で書く。
# 例：make -j4
build_command:

# ビルドでできるファイル（必須）。source_dir からの相対パス。
# 2つ以上なら、outputs: の次の行から、1行に1つずつ、「  - 」に続けて書く。
# 例：build/app
outputs:

# ビルドを待つ最長の秒数。過ぎたら、ビルドを子のプロセスごと止める。
timeout_seconds: 480
