site_name: coverity-triage-kit
site_description: Coverity Connect の警告を CID ごとに調べ、修正コードと逸脱コメントを用意する GitHub Copilot CLI のプラグイン
site_url: https://xclang-brain.github.io/plugin-market-place/
repo_url: https://github.com/xclang-brain/plugin-market-place
repo_name: plugin-market-place
edit_uri: edit/main/docs-site/docs/

# 版と、認証情報・設定ファイルのひな形は、プラグインのファイルから hooks.py が差し込みます
hooks:
  - hooks.py

theme:
  name: material
  language: ja
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  icon:
    logo: material/shield-check-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: ライトモードに切り替える
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: OS の設定に合わせる
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search:
      lang: ja

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - ホーム: index.md
  - 使い方:
      - 準備: use/setup.md
      - 1件ずつの処置: use/first.md
      - 一覧の確認と承認: use/decide.md
      - エージェントによる一括処置: use/delegate.md
      - 画面での選択: use/screen.md
      - 設定: use/settings.md
      - トラブルシューティング: use/trouble.md
  - 開発:
      - 概要と原則: dev/index.md
      - アーキテクチャ: dev/architecture.md
      - 変更時の手順: dev/change.md
      - テスト: dev/test.md
      - サイトの更新: dev/site.md
